name: Public bundle checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Publication allowlist and credential checks
        run: python scripts/check_publication_safety.py --self-test
      - name: Committed source, XML, wheel bytes and RECORD
        run: python scripts/check_release_ready.py --self-test
      - name: Pure Python sequence behavior
        run: |
          python scripts/check_sequence_colors.py
          python scripts/check_sequence_startup.py
