<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Content y=10..54, x=8..56 -> ~70% vertical fill, matches peer logos
       (Blast 76%, Consurf 66%, UniProt 84% in 512x512 frames). -->

  <!-- 3 stacked aligned chains -->
  <rect x="8"  y="10" width="48" height="11" rx="4"
        fill="#E5E7EB" stroke="#111827" stroke-width="2.4"/>
  <rect x="8"  y="26" width="48" height="11" rx="4"
        fill="#E5E7EB" stroke="#111827" stroke-width="2.4"/>
  <rect x="8"  y="42" width="48" height="11" rx="4"
        fill="#E5E7EB" stroke="#111827" stroke-width="2.4"/>

  <!-- Conserved column (purple band crossing all three rows) -->
  <rect x="20" y="10" width="9" height="43"
        fill="#A5B4FC" stroke="#111827" stroke-width="2.4"/>
  <rect x="21.5" y="11.5" width="2.5" height="40" rx="1.2"
        fill="#ffffff" opacity="0.45"/>

  <!-- Variable column (different residue per chain) -->
  <rect x="38" y="10" width="9" height="11" fill="#FDA4AF" stroke="#111827" stroke-width="2.4"/>
  <rect x="38" y="26" width="9" height="11" fill="#FCD34D" stroke="#111827" stroke-width="2.4"/>
  <rect x="38" y="42" width="9" height="11" fill="#86EFAC" stroke="#111827" stroke-width="2.4"/>
</svg>
