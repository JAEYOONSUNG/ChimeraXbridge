<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4047"/>
      <stop offset="0.5" stop-color="#23272c"/>
      <stop offset="1" stop-color="#13161a"/>
    </linearGradient>
    <linearGradient id="fgFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f6"/>
      <stop offset="0.4" stop-color="#a8b1bb"/>
      <stop offset="0.6" stop-color="#6e757d"/>
      <stop offset="1" stop-color="#3a4047"/>
    </linearGradient>
    <linearGradient id="fgFrameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4047"/>
      <stop offset="1" stop-color="#1d2227"/>
    </linearGradient>
    <linearGradient id="fgCanvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d34"/>
      <stop offset="1" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="fgHelix" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d3a6a"/>
      <stop offset="0.5" stop-color="#9ec0ee"/>
      <stop offset="1" stop-color="#26447b"/>
    </linearGradient>
    <linearGradient id="fgSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a8"/>
      <stop offset="0.5" stop-color="#fbcf80"/>
      <stop offset="1" stop-color="#a36719"/>
    </linearGradient>
    <linearGradient id="fgLoop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a83632"/>
      <stop offset="0.5" stop-color="#ff8a87"/>
      <stop offset="1" stop-color="#a83632"/>
    </linearGradient>
    <linearGradient id="fgGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fgShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="54" height="54" rx="10" fill="url(#fgCard)" stroke="#0a0c0f" stroke-width="2"/>
  <rect x="5.6" y="5.6" width="52.8" height="52.8" rx="9.5" fill="none" stroke="#7a8088" stroke-width="0.5" opacity="0.45"/>
  <rect x="5.6" y="5.6" width="52.8" height="3" rx="9" fill="#ffffff" opacity="0.05"/>

  <rect x="9" y="11" width="46" height="42" rx="3" fill="url(#fgFrame)" stroke="#0a0c0f" stroke-width="2" filter="url(#fgShadow)"/>
  <rect x="11" y="13" width="42" height="38" rx="2" fill="url(#fgFrameInner)" stroke="#0a0c0f" stroke-width="0.8"/>
  <rect x="13" y="15" width="38" height="34" rx="1.5" fill="url(#fgCanvas)" stroke="#0a0c0f" stroke-width="0.8"/>

  <g filter="url(#fgShadow)">
    <ellipse cx="22" cy="22" rx="6" ry="3.4" fill="url(#fgHelix)" stroke="#0a0c0f" stroke-width="1"/>
    <ellipse cx="20" cy="20.5" rx="3.2" ry="1.1" fill="#ffffff" opacity="0.4" transform="rotate(-8 20 20.5)"/>
    <ellipse cx="22" cy="29" rx="6" ry="3.4" fill="url(#fgHelix)" stroke="#0a0c0f" stroke-width="1"/>
    <ellipse cx="20" cy="27.5" rx="3.2" ry="1.1" fill="#ffffff" opacity="0.4" transform="rotate(-8 20 27.5)"/>
    <ellipse cx="22" cy="36" rx="6" ry="3.4" fill="url(#fgHelix)" stroke="#0a0c0f" stroke-width="1"/>
    <ellipse cx="20" cy="34.5" rx="3.2" ry="1.1" fill="#ffffff" opacity="0.4" transform="rotate(-8 20 34.5)"/>
  </g>

  <path d="M28 25 C32 26, 33 32, 30 35 C28 37, 33 41, 36 40" stroke="url(#fgLoop)" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#fgShadow)"/>

  <g filter="url(#fgShadow)">
    <polygon points="36,40 49,36 51,38 49,46 35,48" fill="url(#fgSheet)" stroke="#0a0c0f" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="49,36 51,38 49,46" fill="#7e4f15" opacity="0.7" stroke="#0a0c0f" stroke-width="0.8" stroke-linejoin="round"/>
    <line x1="37" y1="42" x2="48" y2="38.5" stroke="#ffffff" stroke-width="0.7" opacity="0.45"/>
  </g>

  <rect x="13" y="15" width="38" height="34" rx="1.5" fill="url(#fgGlass)"/>
</svg>
