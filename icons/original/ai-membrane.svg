<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Membrane">
  <defs>
    <radialGradient id="mhead" cx=".35" cy=".30" r=".75">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <linearGradient id="mwatertop" x1="0" y1="6" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mwaterbot" x1="0" y1="48" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="mcore" x1="0" y1="20" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#fbbf24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="mhelix" x1="28" y1="6" x2="36" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset=".5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
    <filter id="msoft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Water layers (subtle blue gradient outside membrane) -->
  <rect x="4" y="6" width="56" height="10" rx="2" fill="url(#mwatertop)"/>
  <rect x="4" y="48" width="56" height="10" rx="2" fill="url(#mwaterbot)"/>

  <!-- Hydrophobic core (warm yellow band between leaflets) -->
  <rect x="6" y="20" width="52" height="24" rx="3" fill="url(#mcore)" stroke="#a16207" stroke-width="0.6" opacity=".9"/>

  <!-- Lipid acyl tails — top leaflet (zigzag from heads down to mid-bilayer) -->
  <g stroke="#a16207" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M12 19 q-1.2 3 0 6 q1.2 3 0 6"/>
    <path d="M22 19 q-1.2 3 0 6 q1.2 3 0 6"/>
    <path d="M42 19 q-1.2 3 0 6 q1.2 3 0 6"/>
    <path d="M52 19 q-1.2 3 0 6 q1.2 3 0 6"/>
  </g>
  <!-- Lipid acyl tails — bottom leaflet (mirrored) -->
  <g stroke="#a16207" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M12 45 q-1.2 -3 0 -6 q1.2 -3 0 -6"/>
    <path d="M22 45 q-1.2 -3 0 -6 q1.2 -3 0 -6"/>
    <path d="M42 45 q-1.2 -3 0 -6 q1.2 -3 0 -6"/>
    <path d="M52 45 q-1.2 -3 0 -6 q1.2 -3 0 -6"/>
  </g>

  <!-- Transmembrane α-helix (green cylinder piercing the bilayer) -->
  <rect x="27" y="7" width="10" height="50" rx="5" fill="url(#mhelix)" stroke="#14532d" stroke-width="1.5" filter="url(#msoft)"/>
  <!-- Helix turn arcs (suggests right-handed helical winding) -->
  <g stroke="#14532d" stroke-width="0.7" fill="none" opacity=".55">
    <path d="M28.5 13 q3.5 -2 7 0"/>
    <path d="M28.5 21 q3.5 -2 7 0"/>
    <path d="M28.5 29 q3.5 -2 7 0"/>
    <path d="M28.5 37 q3.5 -2 7 0"/>
    <path d="M28.5 45 q3.5 -2 7 0"/>
    <path d="M28.5 51 q3.5 -2 7 0"/>
  </g>

  <!-- Phospholipid heads — top leaflet (orange spheres) -->
  <g stroke="#7c2d12" stroke-width="1.3" filter="url(#msoft)">
    <circle cx="12" cy="16" r="4" fill="url(#mhead)"/>
    <circle cx="22" cy="16" r="4" fill="url(#mhead)"/>
    <circle cx="42" cy="16" r="4" fill="url(#mhead)"/>
    <circle cx="52" cy="16" r="4" fill="url(#mhead)"/>
  </g>
  <!-- Phospholipid heads — bottom leaflet -->
  <g stroke="#7c2d12" stroke-width="1.3" filter="url(#msoft)">
    <circle cx="12" cy="48" r="4" fill="url(#mhead)"/>
    <circle cx="22" cy="48" r="4" fill="url(#mhead)"/>
    <circle cx="42" cy="48" r="4" fill="url(#mhead)"/>
    <circle cx="52" cy="48" r="4" fill="url(#mhead)"/>
  </g>
</svg>
