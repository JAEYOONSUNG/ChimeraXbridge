<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Stylised pyrosetta logo: rosette + small "py" badge -->
  <circle cx="32" cy="32" r="22" fill="#e3eaf3" stroke="#0a0c0f" stroke-width="3"/>
  <!-- Rosette petals -->
  <g fill="#dc2626" stroke="#0a0c0f" stroke-width="2" stroke-linejoin="round">
    <ellipse cx="32" cy="14" rx="6" ry="11"/>
    <ellipse cx="50" cy="32" rx="11" ry="6"/>
    <ellipse cx="32" cy="50" rx="6" ry="11"/>
    <ellipse cx="14" cy="32" rx="11" ry="6"/>
    <ellipse cx="44" cy="20" rx="5" ry="9" transform="rotate(45 44 20)"/>
    <ellipse cx="44" cy="44" rx="5" ry="9" transform="rotate(-45 44 44)"/>
    <ellipse cx="20" cy="20" rx="5" ry="9" transform="rotate(-45 20 20)"/>
    <ellipse cx="20" cy="44" rx="5" ry="9" transform="rotate(45 20 44)"/>
  </g>
  <circle cx="32" cy="32" r="6" fill="#fde68a" stroke="#0a0c0f" stroke-width="2"/>
  <!-- "py" label -->
  <text x="32" y="36" font-family="Helvetica, Arial, sans-serif"
        font-size="9" font-weight="700" fill="#0a0c0f"
        text-anchor="middle">py</text>
</svg>
