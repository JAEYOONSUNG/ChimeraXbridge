<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RMSD">
  <defs>
    <linearGradient id="rmsdCase" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2329"/>
      <stop offset="0.55" stop-color="#11161a"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="rmsdGold" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f4dca0"/>
      <stop offset="1" stop-color="#a07f3b"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="52" height="52" rx="10" fill="url(#rmsdCase)" stroke="#2a3138" stroke-width="1.2"/>
  <!-- two backbone-like curves, one reference (gold) and one target (silver), with dashed deviation lines between them to evoke RMSD -->
  <path d="M12 20 Q26 12 38 22 T54 30" fill="none" stroke="url(#rmsdGold)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M12 36 Q26 30 38 38 T54 44" fill="none" stroke="#bcc1c8" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <!-- deviation tie-lines -->
  <g stroke="#7e858f" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.85">
    <line x1="16" y1="19" x2="16" y2="34"/>
    <line x1="26" y1="14" x2="26" y2="30"/>
    <line x1="38" y1="22" x2="38" y2="38"/>
    <line x1="48" y1="27" x2="48" y2="42"/>
  </g>
  <!-- small RMSD label as serif "Δ" in gold -->
  <text x="32" y="56" font-size="9" font-family="'Didot', 'Bodoni MT', 'Playfair Display', serif"
        font-weight="500" text-anchor="middle" fill="url(#rmsdGold)" letter-spacing="0.5">RMSD</text>
  <!-- subtle inner highlight curve at top edge -->
  <path d="M10 12 Q32 8 54 12" stroke="#3b434c" stroke-width="0.8" fill="none" opacity="0.45"/>
</svg>
