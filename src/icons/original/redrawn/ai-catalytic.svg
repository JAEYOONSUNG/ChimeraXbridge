    <radialGradient id="amber" cx="31%" cy="24%" r="77%"><stop stop-color="#FFF1CD"/><stop offset=".38" stop-color="#F6CB72"/><stop offset="1" stop-color="#C58A32"/></radialGradient>
    <radialGradient id="coral" cx="31%" cy="24%" r="77%"><stop stop-color="#FBE1D9"/><stop offset=".38" stop-color="#EC9D92"/><stop offset="1" stop-color="#C85F5B"/></radialGradient>
