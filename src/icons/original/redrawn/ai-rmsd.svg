    <path d="M16 84C30 50 48 62 60 84S87 105 112 71" stroke="url(#silver)" stroke-width="7.5"/>
    <g stroke-width="3.5">
      <circle cx="17" cy="46" r="6" fill="url(#amber)"/><circle cx="59" cy="47" r="6" fill="url(#amber)"/>
      <circle cx="17" cy="81" r="6" fill="url(#silver)"/><circle cx="59" cy="82" r="6" fill="url(#silver)"/>
    </g>
    <path d="M108 47V63M103 49L108 44L113 49M103 61L108 66L113 61" stroke="#DDE7EF" stroke-width="4"/>
  </g>
</svg>
