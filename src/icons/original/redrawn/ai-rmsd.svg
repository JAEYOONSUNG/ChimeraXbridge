<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>Structural deviation</title>
  <desc>Amber and silver backbone traces are connected by measured separations to depict root mean square structural deviation.</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0C6"/><stop offset=".4" stop-color="#F6CB72"/><stop offset="1" stop-color="#C58A32"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FC"/><stop offset=".4" stop-color="#DDE7EF"/><stop offset="1" stop-color="#8195A6"/></linearGradient>
  </defs>
  <g stroke="#253544" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 36V70M58 47V83M94 52V90" stroke="#8195A6" stroke-width="4" stroke-dasharray="3 7"/>
    <path d="M16 48C30 14 48 30 60 48S87 77 112 39" stroke="#253544" stroke-width="13"/>
    <path d="M16 48C30 14 48 30 60 48S87 77 112 39" stroke="url(#amber)" stroke-width="7.5"/>
